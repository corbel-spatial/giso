[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
hatchling = "*"

[dependencies]
geoarrow-pyarrow = "*"
geopandas = ">=1,<2"
rich-click = "*"
sedonadb = ">=0.3,<1"

[pypi-dependencies]
giso = { path = ".", editable = true }

[environments]
default = { features = ["default"], solve-group = "default" }
dev = { features = ["dev", "docs"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }

[feature.dev.dependencies]
black = "*"
pandas-stubs = "*"
pixi-pycharm = "*"
pytest = "*"
ruff = "*"
types-shapely = "*"

[feature.dev.pypi-dependencies]
slipcover = { git = "https://github.com/plasma-umass/slipcover", branch = "main" }

[feature.dev.tasks]
coverage = "slipcover --source src --json --pretty-print --out ./docs/pytest_coverage.json -m pytest"
lint = "black --check ./src ./tests && ruff check ./src ./tests"
lint-format = "black ./src ./tests && ruff format ./src ./tests"
test = "pytest ./tests"

[feature.docs]
# dependencies should match docs/requirements.txt
dependencies = { jupyter = "*", myst-parser = "*", nbsphinx = "*", notebook = "*", pydata-sphinx-theme = "*", sphinx = "*", sphinx-copybutton = "*" }
tasks = { docs = "./docs/make html" }
target = { win-64 = { tasks = { docs = "./docs/make.bat html" } } }
