[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
geoarrow-pyarrow = ">=0.3.0,<0.4"
geopandas = ">=1.2.0,<2"
rich-click = ">=1.9.9,<2"
sedonadb = ">=0.5.0,<0.6"

[pypi-dependencies]
giso = { path = ".", editable = true }

[workspace.conda-pypi-map]
conda-forge = { mapping = { sedonadb = "sedonadb" } }  # TODO missing win-64 wheels on pypi

[environments.dev.dependencies]
python = ">=3.15.1,<3.16"
geoarrow-types = ">=0.4.1,<0.5"
pandas-stubs = ">=3.0.5.260914,<4"
pixi-pycharm = ">=0.0.12,<0.0.13"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
ruff = ">=0.17.2,<0.18"
scipy-stubs = ">=1.18.1.1,<2"
ty = ">=0.0.91,<0.0.92"
types-geopandas = ">=1.1.4.20261006,<2"
types-shapely = ">=2.1.0.20260402,<3"

[environments.dev.tasks]
coverage = "pytest --cov=giso --cov-report=json:docs/pytest_coverage.json --cov-report=term-missing"
lint-ruff = "ruff check --fix ./src ./tests"
lint-ty = "ty check src/ tests/"
lint = { depends-on = ["lint-ruff", "lint-ty"] }
test = { cmd = "pytest ./tests", depends-on = ["lint"] }

[environments.docs]
dependencies = { jupyter = ">=1.1.1,<2", myst-parser = ">=5.1.0,<6", nbsphinx = ">=0.9.8,<0.10", notebook = ">=7.6.3,<8", pydata-sphinx-theme = ">=0.23.0,<0.24", sphinx = ">=9.2.0,<10", sphinx-copybutton = ">=0.5.2,<0.6" }
tasks = { docs = "./docs/make html" }
target = { win-64 = { tasks = { docs = "./docs/make.bat html" } } }
