[project]
version = "1.0.2"
name = "giso"
authors = [{name = "Peter Von der Porten", email = "dev@corbelspatial.com"}]
dynamic = []
description = "A simple command line tool to help with geocoding country/region ISO 3166-2 codes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: GIS"
]
requires-python = ">=3.11"
dependencies = [
    "geoarrow-pyarrow>=0.2.0",
    "geopandas>=1.0.0",
    "rich-click>=1.9.0",
    "sedonadb>=0.3.0",
]

[project.urls]
homepage = "https://pypi.org/project/giso/"
repository = "https://github.com/corbel-spatial/giso"
issues = "https://github.com/corbel-spatial/giso/issues"
changelog = "https://github.com/corbel-spatial/giso/blob/main/CHANGELOG.md"

[project.scripts]
giso = "giso._cli:cli"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.idea",
    "/.run",
    "/docs",
    "/tests",
    "/tools",
	"/.readthedocs.yaml"
]

[tool.hatch.build.targets.wheel]
packages = ["src/giso"]

[tool.coverage.json]
pretty_print = true
