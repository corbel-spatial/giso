[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
python = "*"
pytest = ">9,<10"
# these should match pixi.toml
geoarrow-pyarrow = "*"
geopandas = ">=1.1.0"
rich-click = "*"
#sedonadb = ">=0.3.0"  # TODO wait for geopandas fix on Python 3.10

[pypi-dependencies]
giso = { path = "..", editable = false }

[environments]
py310 = { features = ["py310"] }
py311 = { features = ["py311"] }
py312 = { features = ["py312"] }
py313 = { features = ["py313"] }
py314 = { features = ["py314"] }

[feature.py310.dependencies]
python = "3.10.*"

[feature.py310.pypi-dependencies]
sedonadb = ">=0.3.0"

[feature.py311.dependencies]
python = "3.11.*"
sedonadb = ">=0.3.0"

[feature.py312.dependencies]
python = "3.12.*"
sedonadb = ">=0.3.0"

[feature.py313.dependencies]
python = "3.13.*"
sedonadb = ">=0.3.0"

[feature.py314.dependencies]
python = "3.14.*"
sedonadb = ">=0.3.0"
