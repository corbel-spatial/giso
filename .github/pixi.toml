[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
python = ">=3.11.15,<3.15"
pytest = ">=9.0.3,<10"
# these should match the root pixi.toml
geoarrow-pyarrow = ">=0.2.0,<0.3"
geopandas = ">=1.1.3,<2"
rich-click = ">=1.9.7,<2"
sedonadb = ">=0.3.0,<0.4"

[tasks]
test = "pytest ../tests"

[pypi-dependencies]
giso = { path = "..", editable = false }

[environments]
py311 = { features = ["py311"] }
py312 = { features = ["py312"] }
py313 = { features = ["py313"] }
py314 = { features = ["py314"] }

[feature.py311.dependencies]
python = ">=3.14.4,<3.15"
sedonadb = ">=0.3.0,<0.4"

[feature.py312.dependencies]
python = ">=3.14.4,<3.15"
sedonadb = ">=0.3.0,<0.4"

[feature.py313.dependencies]
python = ">=3.14.4,<3.15"
sedonadb = ">=0.3.0,<0.4"

[feature.py314.dependencies]
python = ">=3.14.4,<3.15"
sedonadb = ">=0.3.0,<0.4"
