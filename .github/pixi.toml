[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
python = "*"
pytest = ">=9.0.0"
# these should match pixi.toml
geoarrow-pyarrow = ">=0.2.0"
geopandas = ">=1.0.0"
rich-click = ">=1.9.0"
sedonadb = ">=0.3.0"

[tasks]
test = "pytest ../tests"

[pypi-dependencies]
giso = { path = "..", editable = false }

[environments]
py311 = { features = ["py311"] }
py312 = { features = ["py312"] }
py313 = { features = ["py313"] }
py314 = { features = ["py314"] }

[feature.py311.dependencies]
python = "3.11.*"
sedonadb = ">=0.3.0"

[feature.py312.dependencies]
python = "3.12.*"
sedonadb = ">=0.3.0"

[feature.py313.dependencies]
python = "3.13.*"
sedonadb = ">=0.3.0"

[feature.py314.dependencies]
python = "3.14.*"
sedonadb = ">=0.3.0"
