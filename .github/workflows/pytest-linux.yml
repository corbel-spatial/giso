# https://github.com/marketplace/actions/setup-pixi
name: Pytest - Linux
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ "src/**" ]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ py310, py311, py312, py313, py314 ]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/pixi.lock
            .github/pixi.toml
            pyproject.toml
            README.md
            src
            tests
          sparse-checkout-cone-mode: false

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          manifest-path: .github/pixi.toml
          locked: false
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
      - run: pytest tests -v
